# Error messages (default language: English). The key is the error code, e.g. IamError.USER_NOT_FOUND -> UserNotFound.

# Identity & Access
None=None
InvalidCredentials=Invalid username or password.
UserBanned=Your account has been suspended.
UsernameAlreadyTaken=The specified username is already taken.
EmailAlreadyTaken=The specified email is already registered.
InvalidInstitutionalEmail=The email must be a valid institutional (.edu.pe) email address.
InvalidUsername=The username must be 3-100 characters long and contain no whitespace.
WeakPassword=The password must be between 8 and 72 characters long.
UserNotFound=The specified user was not found.
NotProfileOwner=You can only update your own profile.
BioTooLong=The bio cannot exceed 1000 characters.
EmailNotVerified=Verify your institutional email before signing in. We sent you a new verification email; check your inbox and spam folder.
InvalidVerificationToken=The verification link is not valid. It may have been used already or replaced by a newer email.
VerificationTokenExpired=The verification link has expired. Sign in to receive a new one.
VerificationEmailRequested=If the account exists and is not verified yet, we will send a new verification email.
InvalidDeviceToken=The device token cannot be empty, contain spaces or exceed 512 characters.
InterestTopicsRequired=Register at least one interest topic.
TooManyInterestTopics=You can register up to 10 interest topics.
InvalidInterestTopic=Each interest topic must have between 1 and 60 characters.
InvalidFullName=The full name can have up to 150 characters and no control characters.
OperationCancelled=The operation was cancelled.
DatabaseError=A database error occurred.
InternalServerError=An unexpected internal error occurred.

# Credential Verification
FileRequired=A certificate file is required.
InvalidFileType=Only JPG, PNG and PDF files are accepted.
FileTooLarge=The file cannot exceed 10 MB.
DuplicateFile=You have already uploaded this file.
FieldTooLong=One of the certificate fields exceeds its maximum length.
CertificateNotFound=The specified certificate was not found.
NotCertificateOwner=You can only access your own certificates.
InvalidStatusTransition=The certificate is not in a state that allows this operation.
StorageError=The file could not be stored. Please try again.

# Push notifications (the {0} is the course of the certificate in quotes, or the id of the certificate)
CertificateVerifiedPushTitle=Certificate verified
CertificateVerifiedPushBody=Your certificate {0} was verified.
CertificateRejectedPushTitle=Certificate rejected
CertificateRejectedPushBody=Your certificate {0} was rejected. Reason: {1}
CertificateRejectedPushNoReason=No reason was given.
CertificatePushUnnamedCertificate=#{0}

# Learning Path Engine
InvalidGoal=The goal must be between 1 and 500 characters long.
GoalNotInterpretable=We could not match your goal with any skill. Try describing it with more specific terms, such as a technology or a role.
GoalAlreadyAchieved=You have already demonstrated every skill required by this goal.
PlanLimitReached=You reached the limit of your plan. Upgrade to the monthly plan, or keep using the free plan within its limits.
PathNotFound=The learning path was not found.
NotPathOwner=You can only access your own learning path.
PathNotActive=Only an active learning path can be paused.
PathNotPaused=Only a paused learning path can be resumed.
PathPaused=This learning path is paused. Resume it to continue.
NodeNotFound=The specified node was not found.
NodeLocked=This node is locked: complete its prerequisites first.
NodeAlreadyCompleted=This node is already completed.
CertificateNotVerified=Only a certificate that passed the verification can be associated with a node: pending, suspicious or rejected certificates cannot.
CertificateSkillMismatch=This certificate does not correspond to the skill of the node. Check the suggested nodes it does correspond to.
CertificateRequired=Associate a certificate with this node before taking its assessment.
QuestionGenerationFailed=The assessment could not be generated. Please try again.
AdvancedPathUnlockRequired=You have no advanced path unlock available. Redeem one with your SkillCredits first.
InvalidAnswers=Send exactly one answer per question, each between 0 and 3.
InvalidEvidenceUrl=The evidence must be a valid http or https link of up to 500 characters.
InvalidSkillTag=The skill cannot be empty.
RubricNotesRequired=The rubric notes are required.
InvalidDecision=The decision must be Approved or Rejected.
InvalidAvailability=The availability must be true or false.
RubricNotesTooLong=The rubric notes cannot exceed 2000 characters.
InvalidReviewDeadline=Send premiumPlanHours between 1 and 48 and freePlanBusinessDays between 1 and 5.
BlueprintNotFound=The specified assessment was not found.
AttemptNotFound=The specified attempt was not found.
CaseNotFound=The specified verification case was not found.
VerifierProfileNotFound=You do not have a verifier profile yet.
NotBlueprintOwner=You can only answer your own assessments.
NotAttemptOwner=You can only view your own attempts.
NotCaseOwner=You can only modify your own verification cases.
NotAssignedVerifier=This case is not assigned to you.
NotAVerifier=You are not an enabled verifier.
NotSeniorVerifier=Only a Verificador senior (Gold rank and a reliability of 90 or more) can do this.
BlueprintOutdated=This assessment was replaced by a newer one. Request a new assessment for the node.
AttemptAlreadySubmitted=This assessment was already answered. Request a new assessment for the node.
NodeNotAvailable=This node is not available to be demonstrated.
OpenCaseAlreadyExists=This node already has a verification case in progress.
CaseAlreadyResolved=The verification case is already resolved.
CaseNotAssigned=The verification case has no assigned verifier yet.
CaseNotAppealable=The verification case cannot be appealed: only a rejected case can.
AppealAlreadyUsed=The verification case was already appealed.
SkillNotCompleted=You must complete the node of this skill before becoming a verifier for it.
VerifierSkillAlreadyEnabled=You are already enabled as a verifier for this skill.
ReputationNotFound=The reputation has not been recorded yet.
NotReputationOwner=You can only consult your own reputation.
InvalidRedemptionItem=The benefit must be AdvancedPathUnlock or ContributionCertificate.
WalletNotFound=The wallet does not exist yet.
NotWalletOwner=You can only consult your own wallet.
InsufficientBalance=Your SkillCredits are not enough to redeem this benefit.

# Subscription & Billing
InvalidProduct=The product id must have between 1 and 100 characters.
InvalidWebhookEvent=The request is not a valid RevenueCat event.
InvalidWebhookAuthorization=The Authorization header of the webhook is missing or wrong.
PurchaseNotVerified=Google Play has no active purchase of the monthly plan for your account. If you just paid, wait a moment and try again.
SubscriptionNotFound=The specified subscription was not found.
NotSubscriptionOwner=You can only access your own subscription.
SubscriptionNotActive=The subscription already expired.
PaymentGatewayUnavailable=The purchase could not be checked with the store right now. Please try again.

# Moderation & Disputes
InvalidOutcome=The outcome must be Upheld (the certificate is legitimate) or Overturned (it is fraudulent).
InvalidDisputeStatus=The status must be Pending, Resolved or All.
CoordinatorNotesRequired=Write your observations to resolve the dispute.
CoordinatorNotesTooLong=The observations cannot exceed 2000 characters.
DisputeNotFound=The specified dispute was not found.
NotAssignedReviewer=This dispute is not assigned to you.
DisputeAlreadyResolved=The dispute is already resolved.
CertificateNotSuspicious=The certificate is no longer suspicious: it was already resolved.
