# Mensajes de error (español latinoamericano, es-419). La clave es el código del error, igual que en messages.properties.

# Identity & Access
None=None
InvalidCredentials=Usuario o contraseña incorrectos.
UserBanned=Tu cuenta ha sido suspendida.
UsernameAlreadyTaken=El nombre de usuario ya está en uso.
EmailAlreadyTaken=El correo ya está registrado.
InvalidInstitutionalEmail=El correo debe ser un correo institucional válido (.edu.pe).
InvalidUsername=El nombre de usuario debe tener entre 3 y 100 caracteres y no contener espacios.
WeakPassword=La contraseña debe tener entre 8 y 72 caracteres.
UserNotFound=No se encontró el usuario indicado.
NotProfileOwner=Solo puedes modificar tu propio perfil.
BioTooLong=La biografía no puede exceder los 1000 caracteres.
OperationCancelled=La operación fue cancelada.
DatabaseError=Ocurrió un error en la base de datos.
InternalServerError=Ocurrió un error interno inesperado.

# Credential Verification
FileRequired=Se requiere el archivo del certificado.
InvalidFileType=Solo se aceptan archivos JPG, PNG y PDF.
FileTooLarge=El archivo no puede superar los 10 MB.
DuplicateFile=Ya subiste este archivo anteriormente.
FieldTooLong=Uno de los campos del certificado supera su longitud máxima.
CertificateNotFound=No se encontró el certificado indicado.
NotCertificateOwner=Solo puedes acceder a tus propios certificados.
InvalidStatusTransition=El certificado no está en un estado que permita esta operación.
StorageError=No se pudo guardar el archivo. Inténtalo de nuevo.

# Learning Path Engine
InvalidGoal=La meta debe tener entre 1 y 500 caracteres.
GoalNotInterpretable=No pudimos relacionar tu meta con ninguna habilidad. Intenta describirla con términos más específicos, como una tecnología o un rol.
GoalAlreadyAchieved=Ya demostraste todas las habilidades que requiere esta meta.
ActivePathAlreadyExists=Ya tienes una ruta de aprendizaje activa. Complétala antes de declarar una nueva meta.
PathNotFound=No se encontró la ruta de aprendizaje.
NotPathOwner=Solo puedes acceder a tu propia ruta de aprendizaje.
NodeNotFound=No se encontró el nodo indicado.
NodeLocked=Este nodo está bloqueado: completa primero sus prerrequisitos.
NodeAlreadyCompleted=Este nodo ya está completado.
QuestionGenerationFailed=No se pudo generar la evaluación. Inténtalo de nuevo.
