spring.application.name=skillswap-platform
server.port=${PORT:8080}

# The schema is created and changed only by the Flyway migrations (db/migration): Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# The database created by the C# API already has the V1 tables but no Flyway history: on the first run Flyway
# records V1 as the baseline instead of running it, and from then on it applies only V2 and later.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# jsonb columns (career_goal, questions) are written from JSON text: the driver must send strings untyped so
# PostgreSQL reads them as jsonb.
spring.datasource.hikari.data-source-properties.stringtype=unspecified

# Error messages: messages.properties (en) and messages_es_419.properties (es-419)
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

# Comma-separated list. Empty = any origin is allowed.
cors.allowed-origins=

# JWT. The secret is required (at least 32 characters) and must come from the environment:
#   TOKEN_SETTINGS_SECRET=...        TOKEN_SETTINGS_EXPIRATION_DAYS=7 (optional)
# token.settings.secret=

# Cloudinary (certificate files). The three values are required: the application does not start without them.
#   CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
# cloudinary.cloud-name=
# cloudinary.api-key=
# cloudinary.api-secret=

# Gemini (assessment questions). The key is required: the application does not start without it.
#   GEMINI_API_KEY                 (required)
#   GEMINI_MODEL                   (optional, default gemini-3.5-flash)
#   GEMINI_FALLBACK_MODELS         (optional, comma-separated, tried in order when the main model is unavailable)
#   GEMINI_THINKING_LEVEL          (optional, e.g. low)
# gemini.api-key=
# gemini.model=gemini-3.5-flash
# gemini.fallback-models=
# gemini.thinking-level=
# gemini.timeout-seconds=30
# gemini.total-timeout-seconds=60
# gemini.max-retries=1
# gemini.retry-delay-milliseconds=1000

# Interpretation of the goal with Gemini (hybrid: Gemini selects skills of skill-catalog.json and the keyword
# matcher answers instead when Gemini fails, takes longer than the timeout or selects no skill of the catalog).
# It uses the key, models and retries above.
#   GEMINI_GOAL_INTERPRETATION_ENABLED          (optional, default true; false = keyword matching only)
#   GEMINI_GOAL_INTERPRETATION_TIMEOUT_SECONDS  (optional, default 20; the student is waiting)
# gemini.goal-interpretation.enabled=true
# gemini.goal-interpretation.timeout-seconds=20

# Learning paths. Whether a node needs a certificate linked (POST /api/v1/path-nodes/{id}/certificate) before
# its assessment can be generated (409 CertificateRequired otherwise).
#   LEARNING_PATH_ASSESSMENT_REQUIRE_LINKED_CERTIFICATE  (optional, default false)
# learning-path.assessment.require-linked-certificate=false

# RevenueCat (monthly subscription, Google Play Billing). Without REVENUECAT_API_KEY the purchases are SIMULATED
# (nothing is charged), so local development works without a RevenueCat account. Never commit real values.
#   REVENUECAT_API_KEY             secret API key (sk_...) of the RevenueCat project
#   REVENUECAT_WEBHOOK_AUTH        the exact Authorization header value set in the RevenueCat webhook; when empty
#                                  every webhook notification is rejected with 401
#   REVENUECAT_ENTITLEMENT_ID      entitlement that grants the monthly plan (default premium)
#   REVENUECAT_ACCEPT_SANDBOX      whether test purchases (environment SANDBOX) are applied (default true)
revenuecat.api-key=${REVENUECAT_API_KEY:}
revenuecat.webhook-authorization=${REVENUECAT_WEBHOOK_AUTH:}
revenuecat.entitlement-id=${REVENUECAT_ENTITLEMENT_ID:premium}
revenuecat.accept-sandbox-events=${REVENUECAT_ACCEPT_SANDBOX:true}
# revenuecat.connect-timeout-seconds=5
# revenuecat.read-timeout-seconds=10

# Subscriptions whose paid period ended are checked with the gateway this often, in case a webhook was lost.
# BILLING_SIMULATED_PERIOD shortens the periods of the simulated gateway for demos (e.g. 10m).
billing.expiration-check-interval=${BILLING_EXPIRATION_CHECK_INTERVAL:1h}
billing.simulated-period=${BILLING_SIMULATED_PERIOD:30d}

# Uploads. The certificate limit is 10 MB (checked by the application, 413/415 with a friendly error); this
# larger limit only stops clearly abusive requests before they are buffered (413 FileTooLarge as well).
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
