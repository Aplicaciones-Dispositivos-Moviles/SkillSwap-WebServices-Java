spring.application.name=skillswap-platform
server.port=${PORT:8080}

# Same database and schema as the C# API: Hibernate only validates, it never alters it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Error messages: messages.properties (en) and messages_es_419.properties (es-419)
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

# Comma-separated list. Empty = any origin is allowed.
cors.allowed-origins=
