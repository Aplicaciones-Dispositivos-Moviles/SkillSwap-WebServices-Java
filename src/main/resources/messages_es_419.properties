# Mensajes de error (español latinoamericano, es-419). La clave es el código del error, igual que en messages.properties.

# Identity & Access
None=None
InvalidCredentials=Usuario o contraseña incorrectos.
UserBanned=Tu cuenta ha sido suspendida.
UsernameAlreadyTaken=El nombre de usuario ya está en uso.
EmailAlreadyTaken=El correo ya está registrado.
InvalidInstitutionalEmail=El correo debe ser un correo institucional válido (.edu.pe).
InvalidUsername=El nombre de usuario debe tener entre 3 y 100 caracteres y no contener espacios.
WeakPassword=La contraseña debe tener entre 8 y 72 caracteres.
UserNotFound=No se encontró el usuario indicado.
NotProfileOwner=Solo puedes modificar tu propio perfil.
BioTooLong=La biografía no puede exceder los 1000 caracteres.
OperationCancelled=La operación fue cancelada.
DatabaseError=Ocurrió un error en la base de datos.
InternalServerError=Ocurrió un error interno inesperado.

# Credential Verification
FileRequired=Se requiere el archivo del certificado.
InvalidFileType=Solo se aceptan archivos JPG, PNG y PDF.
FileTooLarge=El archivo no puede superar los 10 MB.
DuplicateFile=Ya subiste este archivo anteriormente.
FieldTooLong=Uno de los campos del certificado supera su longitud máxima.
CertificateNotFound=No se encontró el certificado indicado.
NotCertificateOwner=Solo puedes acceder a tus propios certificados.
InvalidStatusTransition=El certificado no está en un estado que permita esta operación.
StorageError=No se pudo guardar el archivo. Inténtalo de nuevo.

# Learning Path Engine
InvalidGoal=La meta debe tener entre 1 y 500 caracteres.
GoalNotInterpretable=No pudimos relacionar tu meta con ninguna habilidad. Intenta describirla con términos más específicos, como una tecnología o un rol.
GoalAlreadyAchieved=Ya demostraste todas las habilidades que requiere esta meta.
ActivePathAlreadyExists=Ya tienes una ruta de aprendizaje activa. Complétala antes de declarar una nueva meta.
PathNotFound=No se encontró la ruta de aprendizaje.
NotPathOwner=Solo puedes acceder a tu propia ruta de aprendizaje.
NodeNotFound=No se encontró el nodo indicado.
NodeLocked=Este nodo está bloqueado: completa primero sus prerrequisitos.
NodeAlreadyCompleted=Este nodo ya está completado.
QuestionGenerationFailed=No se pudo generar la evaluación. Inténtalo de nuevo.
InvalidAnswers=Envía exactamente una respuesta por pregunta, cada una entre 0 y 3.
InvalidEvidenceUrl=La evidencia debe ser un enlace http o https válido de hasta 500 caracteres.
InvalidSkillTag=La habilidad no puede estar vacía.
RubricNotesRequired=Las observaciones de la rúbrica son obligatorias.
InvalidDecision=La decisión debe ser Approved o Rejected.
InvalidAvailability=La disponibilidad debe ser true o false.
RubricNotesTooLong=Las observaciones de la rúbrica no pueden superar los 2000 caracteres.
BlueprintNotFound=No se encontró la evaluación indicada.
AttemptNotFound=No se encontró el intento indicado.
CaseNotFound=No se encontró el caso de verificación indicado.
VerifierProfileNotFound=Todavía no tienes un perfil de Verificador.
NotBlueprintOwner=Solo puedes responder tus propias evaluaciones.
NotAttemptOwner=Solo puedes consultar tus propios intentos.
NotCaseOwner=Solo puedes modificar tus propios casos de verificación.
NotAssignedVerifier=Este caso no está asignado a ti.
NotAVerifier=No eres un Verificador habilitado.
BlueprintOutdated=Esta evaluación fue reemplazada por una más reciente. Solicita una nueva evaluación del nodo.
AttemptAlreadySubmitted=Esta evaluación ya fue respondida. Solicita una nueva evaluación del nodo.
NodeNotAvailable=Este nodo no está disponible para ser demostrado.
OpenCaseAlreadyExists=Este nodo ya tiene un caso de verificación en curso.
CaseAlreadyResolved=El caso de verificación ya fue resuelto.
CaseNotAssigned=El caso de verificación todavía no tiene un Verificador asignado.
CaseNotAppealable=El caso de verificación no se puede apelar: solo se puede apelar un caso rechazado.
AppealAlreadyUsed=El caso de verificación ya fue apelado.
SkillNotCompleted=Debes completar el nodo de esta habilidad antes de ser Verificador de ella.
VerifierSkillAlreadyEnabled=Ya estás habilitado como Verificador de esta habilidad.
ReputationNotFound=Todavía no se ha registrado la reputación.
NotReputationOwner=Solo puedes consultar tu propia reputación.
InvalidRedemptionItem=El beneficio debe ser AdvancedPathUnlock o ContributionCertificate.
WalletNotFound=La billetera todavía no existe.
NotWalletOwner=Solo puedes consultar tu propia billetera.
InsufficientBalance=Tus SkillCredits no alcanzan para canjear este beneficio.

# Subscription & Billing
InvalidProduct=El identificador del producto debe tener entre 1 y 100 caracteres.
InvalidWebhookEvent=La solicitud no es un evento válido de RevenueCat.
InvalidWebhookAuthorization=El encabezado Authorization del webhook falta o es incorrecto.
PurchaseNotVerified=Google Play no tiene una compra vigente del plan mensual para tu cuenta. Si acabas de pagar, espera un momento e inténtalo de nuevo.
SubscriptionNotFound=No se encontró la suscripción.
NotSubscriptionOwner=Solo puedes acceder a tu propia suscripción.
SubscriptionNotActive=La suscripción ya venció.
PaymentGatewayUnavailable=No se pudo verificar la compra con la tienda en este momento. Inténtalo de nuevo.
